table: { schema: public, name: workflow_artifacts }
object_relationships:
  - name: organization
    using: { foreign_key_constraint_on: organization_id }
  - name: workflow_run
    using: { foreign_key_constraint_on: workflow_run_id }
select_permissions:
  - role: user
    permission:
      columns: [id, organization_id, workflow_run_id, step_run_id, payload, created_at]
      filter: { organization: { org_members: { user_id: { _eq: X-Hasura-User-Id } } } }

table: { schema: public, name: organizations }
array_relationships:
  - name: org_members
    using: { foreign_key_constraint_on: organization_id }
  - name: workflows
    using: { foreign_key_constraint_on: organization_id }
  - name: workflow_runs
    using: { foreign_key_constraint_on: organization_id }
select_permissions:
  - role: user
    permission:
      columns: [id, name, calls_used, calls_allowed, quota_period_start, created_at]
      filter: { org_members: { user_id: { _eq: X-Hasura-User-Id } } }
update_permissions:
  - role: user
    permission:
      columns: [name, calls_allowed]
      filter: { org_members: { _and: [{ user_id: { _eq: X-Hasura-User-Id } }, { role: { _eq: owner } }] } }
      check: { org_members: { _and: [{ user_id: { _eq: X-Hasura-User-Id } }, { role: { _eq: owner } }] } }

table: { schema: public, name: workflow_runs }
object_relationships:
  - name: workflow
    using: { foreign_key_constraint_on: workflow_id }
  - name: organization
    using: { foreign_key_constraint_on: organization_id }
array_relationships:
  - name: step_runs
    using: { foreign_key_constraint_on: workflow_run_id }
select_permissions:
  - role: user
    permission:
      columns: [id, workflow_id, organization_id, trigger_type, status, initiated_by, input, error, created_at, started_at, completed_at]
      filter: { organization: { org_members: { user_id: { _eq: X-Hasura-User-Id } } } }

table: { schema: public, name: org_members }
object_relationships:
  - name: organization
    using: { foreign_key_constraint_on: organization_id }
select_permissions:
  - role: user
    permission:
      columns: [organization_id, user_id, role, created_at]
      filter: { organization: { org_members: { user_id: { _eq: X-Hasura-User-Id } } } }
insert_permissions:
  - role: user
    permission:
      columns: [organization_id, user_id, role]
      check: { organization: { org_members: { _and: [{ user_id: { _eq: X-Hasura-User-Id } }, { role: { _eq: owner } }] } } }
delete_permissions:
  - role: user
    permission:
      filter: { organization: { org_members: { _and: [{ user_id: { _eq: X-Hasura-User-Id } }, { role: { _eq: owner } }] } } }

actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: '{{ACTION_BASE_URL}}/api/hasura/action'
      forward_client_headers: true
    permissions:
      - role: user
  - name: approveStep
    definition:
      kind: synchronous
      handler: '{{ACTION_BASE_URL}}/api/hasura/action'
      forward_client_headers: true
    permissions:
      - role: user
custom_types:
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
    - name: ApproveStepOutput
  scalars: []
  enums: []
